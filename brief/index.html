<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Бриф подрядчику · НАВСЕГДА</title>
<meta name="theme-color" content="#4E0002">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --surface2:#F4EADB; --ink:#2A1416; --muted:#7B6560; --line:#E6D8C4;
  --bordo:#4E0002; --wine:#7A1C22; --gold:#BA8A48; --cream:#FFE7C6;
  --ok:#2F7D4F; --warn:#B7791F; --bad:#B42318; --on-wine:#FFFFFF;
  --display:"Cormorant Garamond", Georgia, serif; --sans:"Golos Text", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170D0E; --surface:#231516; --surface2:#2E1C1D; --ink:#F5E9DA; --muted:#BFA79E; --line:#3E2A2A;
  --bordo:#FFE7C6; --wine:#A8343C; --gold:#D9AE6E; --cream:#3A2426; --ok:#6CC08E; --warn:#E3B05A; --bad:#F08A80; --on-wine:#FFFFFF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#170D0E; --surface:#231516; --surface2:#2E1C1D; --ink:#F5E9DA; --muted:#BFA79E; --line:#3E2A2A;
  --bordo:#FFE7C6; --wine:#A8343C; --gold:#D9AE6E; --cream:#3A2426; --ok:#6CC08E; --warn:#E3B05A; --bad:#F08A80; --on-wine:#FFFFFF; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--wine)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--gold)}}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-size:22px;font-weight:700;color:var(--bordo);text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.logo img{height:16px;width:auto}
.logo small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}
main.narrow{max-width:820px}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;color:var(--bordo);text-wrap:balance}
h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:0 0 10px;color:var(--bordo)}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.mu{color:var(--muted)}.sm{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;min-width:0}.row.sb{justify-content:space-between}.wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.grid3{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.p-gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.p-mu{background:var(--surface2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);min-height:38px;line-height:1.2;text-align:center}
.btn.pr{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.btn.gh{background:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted);flex-shrink:0}
.tab[aria-selected="true"]{background:var(--surface2);color:var(--ink)}
.hero{border-radius:20px;padding:20px;background:linear-gradient(135deg,#7A1C22,#3d0a0e);color:#fff}
.hero h1{color:#FFE7C6}
.hero .mu{color:#f0d6cc}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}.kpi span{font-size:12px;color:#f0d6cc}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.todo:last-child{border-bottom:0}
.ic{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.slot:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:14px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.cand{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.cand.sel{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tr.cat td{background:var(--surface2);font-weight:700;font-size:12.5px}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700}
input,textarea,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
.feed{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:10px;font-size:13.5px;padding:9px 11px;border-radius:12px;background:var(--surface2);min-width:0}
.ev time{color:var(--muted);font-size:12px;white-space:nowrap}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stg{font-size:12px;padding:5px 9px;border-radius:9px;background:var(--surface2);color:var(--muted);border:0}
.stg.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.stg.cur{background:var(--wine);color:var(--on-wine)}
button.stg{cursor:pointer;font:inherit;font-size:12px;font-weight:600}
.idea{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.idea .img{height:110px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;background-size:cover;background-position:center}
.idea .b{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.idea .b p{margin:0;font-size:13px;color:var(--muted)}
.idea .b .btn{margin-top:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px}.kv>b{font-weight:600;color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv>b{margin-top:6px}}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.pre{white-space:pre-wrap}
.center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
.center .card{max-width:440px;padding:24px}
.skel{height:14px;border-radius:7px;background:var(--surface2);margin:8px 0;animation:sk 1.2s ease-in-out infinite alternate}
@keyframes sk{from{opacity:.5}to{opacity:1}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,8,9,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.copybox{width:100%;font-size:13px;min-height:80px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec h3{font-family:var(--display);font-size:21px;color:var(--bordo);margin-bottom:6px}
.empty{color:var(--muted);font-style:italic;font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.actions .field{flex:1 1 220px;margin:0}
.print-only{display:none}
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--surface:#fff;--surface2:#f6f1ea;--ink:#000;--muted:#555;--line:#ccc;--bordo:#4E0002}
  body{background:#fff;color:#000;font-size:12pt}
  .top,.no-print,.toast,.actions{display:none!important}
  .print-only{display:block}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .sec{break-inside:avoid}
  .ev{background:#f6f1ea}
  a{color:#000;text-decoration:none}
}
</style>

<body>
<div class="top"><div class="top-in"><a class="logo" href="/"><img src="/assets/brand/mark-gold.svg" alt="">НАВСЕГДА <small>бриф подрядчику</small></a></div></div>
<main id="app" class="narrow"></main>
<div class="toast" id="toast" role="status"></div>
<script>
// Общие помощники кабинета НАВСЕГДА
var KAB = (function(){
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var API = LOCAL ? '' : 'https://109-68-213-160.sslip.io';
  var NET = 'Сервер не ответил. Если включён VPN - отключите его и обновите страницу';
  var TG = 'https://t.me/navsegda_agency', PHONE = '+7 958 541-00-41';
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ n = Number(n) || 0; return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function rub(n){ return fmt(n) + ' ₽'; }
  function parseDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDate(s, wd){ var d = parseDate(s); if(!d) return s || ''; return (wd ? WD[d.getDay()] + ', ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function shortDate(s){ var d = parseDate(s); if(!d) return s || ''; return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); }
  function plural(n, a, b, c){ n = Math.abs(n) % 100; var n1 = n % 10; if(n > 10 && n < 20) return c; if(n1 > 1 && n1 < 5) return b; if(n1 === 1) return a; return c; }
  function toast(t){ var el = $('#toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }
  function api(path, opt){
    opt = opt || {};
    var h = {};
    if(opt.body !== undefined) h['Content-Type'] = 'application/json';
    if(opt.key) h['X-Kab-Key'] = opt.key;
    return fetch(API + path, {method: opt.method || 'GET', headers: h, body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined, cache: 'no-store'})
      .catch(function(){ var e = new Error(NET); e.net = true; throw e; })
      .then(function(r){
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(_){}
          if(!r.ok && r.status >= 502 && !(j && j.detail)){ var e5 = new Error(NET); e5.net = true; e5.status = r.status; throw e5; }
          if(!r.ok){ var e = new Error((j && j.detail && (typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail))) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
          return j;
        });
      });
  }
  // Копирование: буфер обмена, если не вышло - окно с выделенным текстом
  function copy(text, okMsg){
    function fallback(){
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="card stack" role="dialog" aria-modal="true" aria-label="Скопируйте текст"><b>Скопируйте вручную</b><p class="sm mu" style="margin:0">Текст уже выделен - нажмите «Копировать» в меню или Cmd/Ctrl+C.</p><textarea class="copybox" readonly rows="5"></textarea><button class="btn pr" type="button">Готово</button></div>';
      document.body.appendChild(m);
      var ta = m.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); try{ ta.setSelectionRange(0, text.length); }catch(_){}
      try{ if(document.execCommand('copy')) toast(okMsg || 'Скопировано'); }catch(_){}
      function close(){ m.remove(); }
      m.querySelector('button').onclick = close; m.addEventListener('click', function(e){ if(e.target === m) close(); });
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg || 'Скопировано'); }, fallback);
    } else fallback();
  }
  function errBox(e, retry){
    var msg = e && e.message ? e.message : NET;
    return '<div class="center"><div class="card stack"><h2 style="margin:0">Не получилось загрузить</h2><p class="mu" style="margin:0">' + esc(msg) + '</p>' + (retry ? '<button class="btn pr" type="button" onclick="location.reload()">Обновить страницу</button>' : '') + '</div></div>';
  }
  function notFound(what){
    return '<div class="center"><div class="card stack"><div style="font-size:34px">∞</div><h2 style="margin:0">Ссылка не найдена</h2><p class="mu" style="margin:0">' + esc(what || 'Похоже, ссылка устарела или скопировалась не целиком.') + ' Напишите реализатору - пришлём новую.</p><a class="btn pr" href="' + TG + '" target="_blank" rel="noopener">Написать в Telegram</a><p class="sm mu" style="margin:0">Телефон: ' + PHONE + '</p></div></div>';
  }
  function skeleton(){ return '<div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:75%"></div><div class="skel" style="width:60%"></div></div>'; }
  var COL = ['#7A1C22','#BA8A48','#5E7C8A','#4F7F5F','#8C5A7A','#C7795A','#6B5B95'];
  function ini(n){ return String(n || '?').split(/\s+/).map(function(x){ return x[0] || ''; }).join('').slice(0, 2).toUpperCase(); }
  function stLabel(st){ return ({ok:['p-ok','готово'], choose:['p-warn','нужно выбрать'], search:['p-mu','ищем'], wait:['p-warn','на согласовании'], later:['p-mu','позже'], no:['p-mu','не нужно']})[st] || ['p-mu', st || '']; }
  function q(name){ try{ return new URLSearchParams(location.search).get(name) || ''; }catch(_){ return ''; } }
  return {API:API, NET:NET, TG:TG, PHONE:PHONE, $:$, $$:$$, esc:esc, fmt:fmt, rub:rub, parseDate:parseDate, fmtDate:fmtDate, shortDate:shortDate, plural:plural, toast:toast, api:api, copy:copy, errBox:errBox, notFound:notFound, skeleton:skeleton, COL:COL, ini:ini, stLabel:stLabel, q:q};
})();

(function(){
var K = KAB, esc = K.esc, $ = K.$;
var T = K.q('t'), D = null, app = $('#app');
function txt(v){ return v && String(v).trim() ? '<div class="pre">' + esc(v) + '</div>' : '<div class="empty">Пока не заполнено - реализатор дополнит</div>'; }
function load(){
  app.innerHTML = K.skeleton() + K.skeleton();
  K.api('/api/kab/brief/' + encodeURIComponent(T)).then(function(d){ D = d; render(); }, function(e){
    app.innerHTML = e.status === 404 ? K.notFound('Этого брифа нет.') : K.errBox(e, true);
  });
}
function render(){
  document.title = 'Бриф: ' + (D.role_name || '') + ' · ' + (D.names || '') + ' · НАВСЕГДА';
  var team = D.team || {}, tk = Object.keys(team), w = D.wishes || [];
  var place = [D.venue, D.venue_address].filter(Boolean).join(', ');
  var h = '<article class="card"><div class="sm mu">Бриф · ' + esc(D.role_name) + (D.who ? ' · ' + esc(D.who) : '') + '</div>' +
    '<h1 style="margin:6px 0">' + esc(D.names) + '</h1>' +
    '<div class="mu">' + [D.date ? K.fmtDate(D.date, true) : '', D.guests ? D.guests + ' ' + K.plural(+D.guests || 0, 'гость', 'гостя', 'гостей') : ''].filter(Boolean).map(esc).join(' · ') + '</div>' +
    '<p class="sm mu no-print" style="margin:8px 0 0">Бриф обновляется сам - откройте ссылку ещё раз перед созвоном и в день свадьбы.</p>' +
    '<div class="sec kv"><b>Ваша роль</b><span>' + esc(D.role_name) + (D.who ? ' - ' + esc(D.who) : '') + '</span>' +
    '<b>Площадка</b><span>' + (place ? esc(place) : '<span class="empty">уточняется</span>') + '</span>' +
    '<b>Реализатор</b><span>' + esc(D.realizer || 'команда НАВСЕГДА') + ' · вопросы в <a href="' + K.TG + '" target="_blank" rel="noopener">Telegram</a> или по телефону ' + K.PHONE + '</span></div>';
  if(D.for_role) h += '<div class="sec"><h3>Что важно для вас</h3>' + txt(D.for_role) + '</div>';
  h += '<div class="sec"><h3>Тайминг</h3>' + txt(D.timing) + '</div>' +
    '<div class="sec"><h3>История пары</h3>' + txt(D.story) + '</div>' +
    '<div class="sec"><h3>Важные люди</h3>' + txt(D.people) + '</div>' +
    '<div class="sec"><h3>Музыка</h3>' + txt(D.music) + '</div>' +
    '<div class="sec"><h3>Стоп-лист</h3>' + txt(D.stop) + '</div>' +
    '<div class="sec"><h3>Пожелания пары</h3>' + (w.length ? '<div class="feed">' + w.map(function(x){ return '<div class="ev"><span aria-hidden="true">💬</span><span class="pre">' + esc(x) + '</span></div>'; }).join('') + '</div>' : '<div class="empty">Пока нет</div>') + '</div>' +
    '<div class="sec"><h3>Команда на свадьбе</h3>' + (tk.length ? '<div class="kv">' + tk.map(function(k){ return '<b>' + esc(k) + '</b><span>' + esc(team[k]) + '</span>'; }).join('') + '</div>' : '<div class="empty">Команда собирается</div>') + '</div>';
  h += '<div class="sec actions" id="act">';
  if(D.ready){
    h += '<span class="pill p-ok" style="white-space:normal">✓ Вы ознакомились' + (D.ready.at ? ' ' + esc(D.ready.at) : '') + (D.ready.call ? ' · созвон: ' + esc(D.ready.call) : '') + '</span>';
  } else {
    h += '<div class="field"><label for="call">Когда удобно созвониться</label><input id="call" maxlength="100" placeholder="например, чт 19:00"></div><button class="btn pr" type="button" id="ready">Ознакомился, готов к созвону</button>';
  }
  h += '<button class="btn gh" type="button" id="pdf">⬇ Скачать PDF</button></div>';
  h += '<p class="print-only sm mu" style="margin-top:16px">НАВСЕГДА · ' + K.PHONE + ' · t.me/navsegda_agency</p></article>';
  app.innerHTML = h;
  var r = $('#ready'); if(r) r.onclick = ready;
  $('#pdf').onclick = function(){ window.print(); };
}
function ready(){
  var b = $('#ready'), call = ($('#call').value || '').trim();
  b.disabled = true; b.textContent = 'Отправляем...';
  K.api('/api/kab/brief/' + encodeURIComponent(T) + '/ready', {method:'POST', body:{call:call}}).then(function(){
    K.toast('Спасибо! Реализатор получил отметку');
    return K.api('/api/kab/brief/' + encodeURIComponent(T)).then(function(d){ D = d; render(); });
  }, function(e){ K.toast(e.message); b.disabled = false; b.textContent = 'Ознакомился, готов к созвону'; });
}
if(!T){ app.innerHTML = K.notFound('В ссылке нет кода брифа.'); return; }
load();
})();
</script>
</body>
</html>
