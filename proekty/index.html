<!DOCTYPE html>

<style>

  --ok:#2F7D4F; --warn:#B7791F; --bad:#B42318; --on-wine:#FFFFFF;
  --display:"Cormorant Garamond", Georgia, serif; --sans:"Golos Text", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170D0E; --surface:#231516; --surface2:#2E1C1D; --ink:#F5E9DA; --muted:#BFA79E; --line:#3E2A2A;
  --bordo:#FFE7C6; --wine:#A8343C; --gold:#D9AE6E; --cream:#3A2426; --ok:#6CC08E; --warn:#E3B05A; --bad:#F08A80; --on-wine:#FFFFFF; color-scheme:dark }}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--wine)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--gold)}}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-size:22px;font-weight:700;color:var(--bordo);text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.logo img{height:16px;width:auto}
.logo small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted)}

main.narrow{max-width:820px}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;color:var(--bordo);text-wrap:balance}

.row{display:flex;gap:10px;align-items:center;min-width:0}.row.sb{justify-content:space-between}.wrapf{flex-wrap:wrap}

.ev{display:flex;gap:10px;font-size:13.5px;padding:9px 11px;border-radius:12px;background:var(--surface2);min-width:0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px}.kv>b{font-weight:600;color:var(--muted)}

.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.pre{white-space:pre-wrap}
.center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}

.modal{position:fixed;inset:0;z-index:70;background:rgba(20,8,9,.55);display:flex;align-items:center;justify-content:center;padding:16px}

.copybox{width:100%;font-size:13px;min-height:80px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.desk{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}body.has-cur #main{order:-1}}
.back{display:none}
@media (max-width:900px){body.has-cur .back{display:inline-flex}}
.side{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto}

.pairs{display:flex;flex-direction:column;gap:8px}

.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.ed{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.ed .field{margin:0}
.erow{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.6fr) auto;align-items:start;background:var(--surface)}
.erow.pp{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto}
.erow.dc{grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto}
@media (max-width:700px){.erow,.erow.pp,.erow.dc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.erow .full{grid-column:1/-1}}
.erow input,.erow select{padding:7px 9px;font-size:13.5px}
.elist{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.tag{display:inline-flex;gap:4px;align-items:center;background:var(--surface2);border-radius:8px;padding:2px 4px 2px 8px;font-size:12px;margin:2px 4px 0 0}
.tag button{border:0;background:transparent;cursor:pointer;padding:0 4px;color:var(--muted);font-size:14px;line-height:1}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:10px;cursor:pointer;width:34px;height:34px;color:var(--muted)}
.res{border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-top:10px;background:color-mix(in srgb,var(--gold) 8%,transparent)}
.res input{font-size:13px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:6px;margin:8px 0}
.checks label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;cursor:pointer;background:var(--surface)}
.checks input{margin-top:3px;flex-shrink:0}
.dirty{box-shadow:inset 3px 0 0 var(--gold)}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;margin:6px 0}
.reglist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;margin-top:8px}
.regit{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mtabs{display:flex;gap:4px;margin:6px 0 10px}
.kpi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.kpi2 div{background:var(--surface2);border-radius:12px;padding:8px 10px}.kpi2 b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.kpi2 span{font-size:12px;color:var(--muted)}
.ev a{cursor:pointer;text-decoration:underline}
</style>

<script>
// Общие помощники кабинета НАВСЕГДА
var KAB = (function(){
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var API = LOCAL ? '' : 'https://109-68-213-160.sslip.io';
  var NET = 'Сервер не ответил. Если включён VPN - отключите его и обновите страницу';
  var TG = 'https://t.me/navsegda_agency', PHONE = '+7 958 541-00-41';
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ n = Number(n) || 0; return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function rub(n){ return fmt(n) + ' ₽'; }
  function parseDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDate(s, wd){ var d = parseDate(s); if(!d) return s || ''; return (wd ? WD[d.getDay()] + ', ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function shortDate(s){ var d = parseDate(s); if(!d) return s || ''; return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); }
  function plural(n, a, b, c){ n = Math.abs(n) % 100; var n1 = n % 10; if(n > 10 && n < 20) return c; if(n1 > 1 && n1 < 5) return b; if(n1 === 1) return a; return c; }
  function toast(t){ var el = $('#toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }
  function api(path, opt){
    opt = opt || {};
    var h = {};
    if(opt.body !== undefined) h['Content-Type'] = 'application/json';
    if(opt.key) h['X-Kab-Key'] = opt.key;
    if(opt.session) h['X-Kab-Session'] = opt.session;
    return fetch(API + path, {method: opt.method || 'GET', headers: h, body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined, cache: 'no-store'})
      .catch(function(){ var e = new Error(NET); e.net = true; throw e; })
      .then(function(r){
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(_){}
          if(!r.ok && r.status >= 502 && !(j && j.detail)){ var e5 = new Error(NET); e5.net = true; e5.status = r.status; throw e5; }
          if(!r.ok){ var e = new Error((j && j.detail && (typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail))) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
          return j;
        });
      });
  }
  // Копирование: буфер обмена, если не вышло - окно с выделенным текстом
  function copy(text, okMsg){
    function fallback(){
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="card stack" role="dialog" aria-modal="true" aria-label="Скопируйте текст"><b>Скопируйте вручную</b><p class="sm mu" style="margin:0">Текст уже выделен - нажмите «Копировать» в меню или Cmd/Ctrl+C.</p><textarea class="copybox" readonly rows="5"></textarea><button class="btn pr" type="button">Готово</button></div>';
      document.body.appendChild(m);
      var ta = m.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); try{ ta.setSelectionRange(0, text.length); }catch(_){}
      try{ if(document.execCommand('copy')) toast(okMsg || 'Скопировано'); }catch(_){}
      function close(){ m.remove(); }
      m.querySelector('button').onclick = close; m.addEventListener('click', function(e){ if(e.target === m) close(); });
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg || 'Скопировано'); }, fallback);
    } else fallback();
  }
  function errBox(e, retry){
    var msg = e && e.message ? e.message : NET;
    return '<div class="center"><div class="card stack"><h2 style="margin:0">Не получилось загрузить</h2><p class="mu" style="margin:0">' + esc(msg) + '</p>' + (retry ? '<button class="btn pr" type="button" onclick="location.reload()">Обновить страницу</button>' : '') + '</div></div>';
  }
  function notFound(what){
    return '<div class="center"><div class="card stack"><div style="font-size:34px">∞</div><h2 style="margin:0">Ссылка не найдена</h2><p class="mu" style="margin:0">' + esc(what || 'Похоже, ссылка устарела или скопировалась не целиком.') + ' Напишите реализатору - пришлём новую.</p><a class="btn pr" href="' + TG + '" target="_blank" rel="noopener">Написать в Telegram</a><p class="sm mu" style="margin:0">Телефон: ' + PHONE + '</p></div></div>';
  }
  function skeleton(){ return '<div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:75%"></div><div class="skel" style="width:60%"></div></div>'; }

    ta('cAbout', 'Описание', c.about, 2) + '<div class="ed">' + ta('cPhotos', 'Фото (ссылка на строку)', [].concat(c.photos || []).join('\n'), 2) + ta('cLinks', 'Ссылки на примеры (по строке)', [].concat(c.links || []).join('\n'), 2) + '</div>' +
    '<div class="row wrapf"><button class="btn pr" type="submit">' + (c.id ? 'Сохранить «' + esc(c.name) + '»' : '＋ Добавить в каталог') + '</button>' + (c.id ? '<button class="btn" type="button" data-cnew>Отмена</button><span class="sm mu">id: ' + esc(c.id) + '</span>' : '') + '</div></form></div>' +
    '<div class="card"><h3>Позиции · ' + CAT.length + '</h3><div class="stack" style="gap:8px">' + CAT.map(function(x){
      return '<div class="ev" style="justify-content:space-between;flex-wrap:wrap"><span style="min-width:0;flex:1 1 220px"><span class="pill p-mu">' + esc(x.cat) + '</span> <b>' + esc(x.name) + '</b><br><span class="sm mu">' + esc([x.tag, x.price].filter(Boolean).join(' · ')) + '</span></span><span class="row"><button class="btn sm" type="button" data-cedit="' + esc(x.id) + '">Изменить</button><button class="btn sm gh" type="button" data-cdel="' + esc(x.id) + '">Удалить</button></span></div>';
    }).join('') + '</div></div>';
  $('#catF').onsubmit = function(e){
    e.preventDefault();
    var body = {cat:val('cCat').trim(), name:val('cName').trim(), tag:val('cTag').trim(), price:val('cPrice').trim(), about:val('cAbout').trim(), photos:lines(val('cPhotos')), links:lines(val('cLinks'))};
    if(c.id) body.id = c.id;
    var b = e.target.querySelector('button[type=submit]'); b.disabled = true;
    api('/api/kab/catalog', {method:'POST', body:body}).then(function(){ K.toast('Каталог обновлён'); CEDIT = null; return loadCat().then(drawCatalog); }, function(err){ K.toast(err.message); b.disabled = false; });
  };
}

// ───── клики ─────
document.addEventListener('click', function(e){
  var t = e.target.closest('button,a'); if(!t) return;
  var d = t.dataset;
  if(d.open){ e.preventDefault(); if(location.hash.slice(1) === d.open) openProject(d.open); else location.hash = d.open; return; }
  if(d.copy !== undefined){ K.copy(d.copy); return; }
  if(d.close !== undefined && t.tagName === 'A'){ var mm = $('#cmodal'); if(mm) mm.remove(); return; }
  if(d.cnew !== undefined){ CEDIT = null; drawCatalog(); return; }
  if(d.cedit){ CEDIT = CAT.filter(function(x){ return x.id === d.cedit; })[0] || null; drawCatalog(); window.scrollTo({top:0}); return; }
  if(d.cdel){ var it = CAT.filter(function(x){ return x.id === d.cdel; })[0]; if(!confirm('Удалить из каталога «' + (it ? it.name : d.cdel) + '»?')) return; t.disabled = true;
    api('/api/kab/catalog/' + encodeURIComponent(d.cdel), {method:'DELETE'}).then(function(){ K.toast('Удалено'); return loadCat().then(drawCatalog); }, function(err){ K.toast(err.message); t.disabled = false; }); return; }
  if(!CUR) return;
  if(d.act === 'copyLink'){ K.copy(pairLink(), 'Ссылка кабинета скопирована'); return; }
  if(d.act === 'copyMsg'){ K.copy(pairMsg(CUR.names, pairLink()), 'Сообщение паре скопировано'); return; }
  if(d.act === 'mkSel'){ mkSel(t); return; }
  if(d.rot){ var RT = {pin:'Сменить код входа? Пара выйдет на всех устройствах и войдёт по новому коду.', sessions:'Выйти на всех устройствах пары? Войти можно будет по тому же коду.', pair:'Выдать новую ссылку и код? Старая ссылка перестанет работать - новую нужно будет отправить паре.'};
    if(!confirm(RT[d.rot])) return; t.disabled = true;
    api('/api/kab/projects/' + encodeURIComponent(CUR.id) + '/rotate', {method:'POST', body:{what:d.rot}}).then(function(r){ K.toast('Готово. ' + (d.rot === 'sessions' ? 'Пара вышла со всех устройств' : 'Не забудьте отправить паре новое сообщение')); openProject(CUR.id); }, function(err){ K.toast(err.message); t.disabled = false; }); return; }
  if(d.act === 'access'){ t.disabled = true; api('/api/kab/projects/' + encodeURIComponent(CUR.id) + '/access').then(function(r){ var a = r.access || [];
    $('#accBox').innerHTML = '<div class="sm" style="margin-top:8px">' + (a.length ? a.slice(0, 30).map(function(x){ return esc(x.at) + ' · ' + esc(({pair:'кабинет пары', login:'вход по коду', pin:'неверный код', sel:'подборка'})[x.kind] || x.kind) + ' · ' + esc(x.result === 'ok' ? 'ок' : 'отказ') + ' · ' + esc(x.ip) + ' · <span class="mu">' + esc((x.ua || '').slice(0, 40)) + '</span>'; }).join('<br>') : 'Входов пока не было') + '</div>'; t.disabled = false; }, function(err){ K.toast(err.message); t.disabled = false; }); return; }
  if(d.stage !== undefined){ var st = +d.stage; if(st === (CUR.stage || 0)) return; t.disabled = true; patch({stage:st}, 'Этап: ' + stages()[st]).catch(function(){ t.disabled = false; }); return; }
  if(d.save){ save(d.save, t); return; }
  if(d.brief){ mkBrief(d.brief, t); return; }
  if(d.addrow){ var key = d.addrow; ED[key] = ED[key] || []; ED[key].push(key === 'slots' ? {key:'', status:'search', who:'', note:'', cands:[], picked:null} : key === 'payplan' ? {name:'', amount:'', due:'', status:'wait'} : {name:'', url:''}); repaintKeep(secOf(key)); markDirty(secOf(key)); var rows = $$('#sec-' + secOf(key) + ' .erow'); if(rows.length) rows[rows.length - 1].querySelector('input').focus(); return; }
  if(d.delrow){ ED[d.delrow].splice(+d.i, 1); repaintKeep(secOf(d.delrow)); markDirty(secOf(d.delrow)); return; }
  if(d.delcand){ var ij = d.delcand.split(':'); ED.slots[+ij[0]].cands.splice(+ij[1], 1); repaintKeep('slots'); markDirty('slots'); return; }
  if(d.unpick){ ED.slots[+d.unpick].picked = null; repaintKeep('slots'); markDirty('slots'); return; }
});
window.addEventListener('beforeunload', function(e){ if(Object.keys(DIRTY).some(function(k){ return DIRTY[k]; })){ e.preventDefault(); e.returnValue = ''; } });

if(!KEY) gate(); else start();
})();
</script>
