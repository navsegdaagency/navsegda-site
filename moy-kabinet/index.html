<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Мой кабинет · НАВСЕГДА</title>
<meta name="theme-color" content="#4E0002">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --surface2:#F4EADB; --ink:#2A1416; --muted:#7B6560; --line:#E6D8C4;
  --bordo:#4E0002; --wine:#7A1C22; --gold:#BA8A48; --cream:#FFE7C6; --chip:#F4EADB; --chip-on:#4E0002; --chip-on-ink:#FFE7C6;
  --display:"Cormorant Garamond", Georgia, serif; --sans:"Golos Text", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170D0E; --surface:#231516; --surface2:#2E1C1D; --ink:#F5E9DA; --muted:#BFA79E; --line:#3E2A2A;
  --bordo:#FFE7C6; --wine:#E2A3A8; --gold:#D9AE6E; --cream:#3A2426; --chip:#2E1C1D; --chip-on:#FFE7C6; --chip-on-ink:#4E0002; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#170D0E; --surface:#231516; --surface2:#2E1C1D; --ink:#F5E9DA; --muted:#BFA79E; --line:#3E2A2A;
  --bordo:#FFE7C6; --wine:#E2A3A8; --gold:#D9AE6E; --cream:#3A2426; --chip:#2E1C1D; --chip-on:#FFE7C6; --chip-on-ink:#4E0002; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-size:22px;font-weight:700;color:var(--bordo);display:inline-flex;align-items:center;gap:8px}
.logo img{height:16px;width:auto}
.link-btn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 4px}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h1{font-family:var(--display);font-size:clamp(32px,7vw,46px);line-height:1.05;margin:0;color:var(--bordo);text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.tools{display:flex;flex-direction:column;gap:12px;margin:20px 0 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);padding:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h2{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;color:var(--bordo)}
.who{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sec-intro{color:var(--muted);margin:8px 0 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 6px}
.grp.learn{background:var(--surface2);border-color:transparent}
.grp h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp.learn h3{color:var(--wine)}
ol,ul{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.grp li:first-child .item{border-top:0}
.grp.learn .item{border-top-color:rgba(122,28,34,.12)}
.mark{grid-row:span 2;min-width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--surface2);color:var(--wine)}
.grp.learn .mark{background:var(--bordo);color:var(--cream);border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
.t{font-weight:600;line-height:1.35}
.item:hover .t{color:var(--wine);text-decoration:underline;text-underline-offset:3px}
.n{font-size:13.5px;color:var(--muted);line-height:1.4}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:600;margin-left:6px}
.empty{color:var(--muted);padding:30px 0}
.foot{margin-top:40px;color:var(--muted);font-size:13px;max-width:62ch}
.gate{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:34px}
.gate label{font-size:13px;color:var(--muted)}
.gate input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.btn{border:0;border-radius:12px;background:var(--bordo);color:var(--cream);padding:12px 16px;font-weight:600;cursor:pointer}
.err{color:#B42318;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F08A80}}
.skel{height:120px;border-radius:16px;background:var(--surface2);margin-top:14px}
@media (prefers-reduced-motion: no-preference){.grp{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="/"><img src="/assets/brand/mark-gold.svg" alt="">НАВСЕГДА</a><button class="link-btn" id="out" type="button" hidden>Выйти</button></div></header>
<main id="app"><div class="skel"></div><div class="skel"></div></main>
<script>
(function(){
var API = 'https://109-68-213-160.sslip.io';
var LS = 'nsg-kab-key';
var app = document.getElementById('app'), outBtn = document.getElementById('out');
var KINDS = {doc:'Док', sheet:'Таблица', folder:'Папка', file:'Файл', site:'Сайт', bot:'Бот', app:'Сервис'};
var MARKS = {doc:'Д', sheet:'Т', folder:'П', file:'Ф', site:'С', bot:'@', app:'↗'};
var DATA = null, ROLE = 'all', QUERY = '';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k) || ''; if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return ''; }

// ключ из ссылки #k=... сохраняем на этом устройстве и убираем из адреса
(function(){
  var m = /[#&]k=([^&]+)/.exec(location.hash || '');
  if(m){ ls(LS, decodeURIComponent(m[1])); try{ history.replaceState(null, '', location.pathname); }catch(e){} }
})();

function load(key){
  return fetch(API + '/api/kab/hub', {headers:{'X-Kab-Key':key}, cache:'no-store'}).then(function(r){
    if(r.status === 403){ var e = new Error('Ключ не подошёл'); e.status = 403; throw e; }
    if(!r.ok) throw new Error('Сервер ответил ' + r.status);
    return r.json();
  }, function(){ throw new Error('Нет связи с сервером. Если включён VPN - выключите его и обновите страницу.'); });
}

function gate(msg){
  outBtn.hidden = true;
  app.innerHTML = '<form class="gate" id="g"><h1>Мой кабинет</h1><p class="lead" style="margin:0">Все важные ссылки, таблицы и обучение по вашему направлению. Ключ выдаёт Денис, он сохранится на этом устройстве.</p>' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<label for="k">Личный ключ</label><input id="k" type="password" autocomplete="current-password" required><button class="btn" type="submit">Войти</button></form>';
  document.getElementById('g').onsubmit = function(e){
    e.preventDefault(); var v = document.getElementById('k').value.trim(); if(!v) return;
    var b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Проверяем...';
    load(v).then(function(d){ ls(LS, v); show(d); }, function(err){ gate(err.message); });
  };
}

function itemHtml(x, i, learn){
  var k = KINDS[x.kind] ? x.kind : 'site';
  return '<li><a class="item" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' +
    '<span class="mark" aria-hidden="true">' + (learn ? (i + 1) : MARKS[k]) + '</span>' +
    '<span class="t">' + esc(x.t) + '<span class="kind">' + KINDS[k] + '</span></span>' +
    (x.note ? '<span class="n">' + esc(x.note) + '</span>' : '<span></span>') + '</a></li>';
}

function match(x){
  if(!QUERY) return true;
  return (x.t + ' ' + (x.note || '')).toLowerCase().indexOf(QUERY) >= 0;
}

function paint(){
  var out = '', any = false;
  DATA.sections.forEach(function(s){
    if(ROLE !== 'all' && s.id !== ROLE) return;
    var gh = '';
    (s.groups || []).forEach(function(g){
      var items = (g.items || []).filter(match);
      if(!items.length) return;
      var tag = g.learn ? 'ol' : 'ul';
      gh += '<div class="grp' + (g.learn ? ' learn' : '') + '"><h3>' + esc(g.title) + '</h3><' + tag + '>' +
        items.map(function(x, i){ return itemHtml(x, i, g.learn && !QUERY); }).join('') + '</' + tag + '></div>';
    });
    if(!gh) return;
    any = true;
    out += '<section class="sec" id="s-' + esc(s.id) + '"><div class="sec-h"><h2>' + esc(s.title) + '</h2>' +
      ((s['for'] || []).indexOf('base') >= 0 ? '' : '<span class="who">' + esc((s['for'] || []).map(function(r){ return (DATA.role_names || {})[r] || r; }).join(', ')) + '</span>') +
      '</div>' + (s.intro ? '<p class="sec-intro">' + esc(s.intro) + '</p>' : '') + '<div class="groups">' + gh + '</div></section>';
  });
  document.getElementById('list').innerHTML = any ? out : '<p class="empty">Ничего не нашлось. Попробуйте другое слово.</p>';
}

function show(d){
  DATA = d; outBtn.hidden = false;
  var secs = d.sections || [];
  var chips = '<button class="chip" type="button" data-r="all" aria-pressed="true">Всё</button>' +
    secs.map(function(s){ return '<button class="chip" type="button" data-r="' + esc(s.id) + '" aria-pressed="false">' + esc(s.title) + '</button>'; }).join('');
  var hello = d.name ? esc(d.name) + ', ваш кабинет' : 'Ваш кабинет';
  app.innerHTML = '<h1>' + hello + '</h1><p class="lead">Ссылки, таблицы и обучение по направлениям. «Обучение» читать по порядку - сверху вниз.</p>' +
    '<div class="tools">' + (secs.length > 1 ? '<div class="chips" role="group" aria-label="Направления">' + chips + '</div>' : '') +
    '<input class="search" id="q" type="search" placeholder="Найти: смета, договор, площадки..." aria-label="Поиск по ссылкам"></div>' +
    '<div id="list"></div>' +
    '<p class="foot">Если документ не открывается - нажмите в Google «Запросить доступ», Денис откроет. Нужна новая ссылка или раздел - напишите Денису.' + (d.updated ? ' Обновлено ' + esc(d.updated) + '.' : '') + '</p>';
  var cs = app.querySelectorAll('.chip');
  for(var i = 0; i < cs.length; i++){
    cs[i].onclick = function(){
      ROLE = this.getAttribute('data-r');
      for(var j = 0; j < cs.length; j++) cs[j].setAttribute('aria-pressed', cs[j] === this ? 'true' : 'false');
      paint(); window.scrollTo(0, 0);
    };
  }
  document.getElementById('q').oninput = function(){ QUERY = this.value.trim().toLowerCase(); paint(); };
  paint();
}

outBtn.onclick = function(){ ls(LS, null); gate(); };

var key = ls(LS);
if(!key) gate();
else load(key).then(show, function(err){ if(err.status === 403) ls(LS, null); gate(err.status === 403 ? 'Ключ не подошёл или устарел - введите заново' : err.message); });
})();
</script>
</body>
</html>
