var HERO_PH = IMG + 'ruslan-darya/17.webp';   // выездная церемония без людей
var GALLERY = [[IMG + 'konstantin-darya/12.webp', 'Декор в белом и зелени'], [IMG + 'dmitriy-diana/04.webp', 'Президиум в цветах'], [IMG + 'konstantin-darya/14.webp', 'Шампанская башня на велкоме'], [IMG + 'ruslan-darya/13.webp', 'Арка из драпировки']];

function call(path, opt){ opt = opt || {}; opt.session = S; return K.api('/api/kab/pair/' + encodeURIComponent(T) + path, opt).catch(function(e){ if(e.status === 401 && path){ pinScreen(); } throw e; }); }
function load(quiet){
  if(!quiet) app.innerHTML = K.skeleton() + K.skeleton();
  return call('').then(function(d){ D = d; render(); }, function(e){
    if(e.status === 401){ pinScreen(); return; }
    if(quiet){ K.toast(e.message); return; }
    app.innerHTML = e.status === 404 ? K.notFound('Этой ссылки на кабинет нет.') : K.errBox(e, true);
  });
}
function pinScreen(msg){
  D = null; S = ''; K.ls(SK, null);
  app.innerHTML = '<div class="center"><form class="card stack" id="pinForm" style="max-width:360px;width:100%"><div style="font-size:34px;color:var(--gold,#BA8A48)">∞</div>' +
    '<h2 style="margin:0">Вход в личный кабинет</h2><p class="mu sm" style="margin:0">Введите 4-значный код из сообщения реализатора. На этом устройстве код больше не спросим 90 дней.</p>' +
    '<div class="field"><label for="pin">Код входа</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" required style="font-size:28px;letter-spacing:.5em;text-align:center"></div>' +
    (msg ? '<p class="sm" role="alert" style="margin:0;color:#e0897f">' + esc(msg) + '</p>' : '') +
    '<button class="btn pr" type="submit">Войти</button><p class="sm mu" style="margin:0">Нет кода? <a href="' + K.TG + '" target="_blank" rel="noopener">Напишите нам</a> - пришлём заново.</p>' +
    '<p class="sm mu" style="margin:0">🔒 Смета и личные данные видны только тем, у кого есть и ссылка, и код.</p></form></div>';
  var f = $('#pinForm'), inp = $('#pin'); inp.focus();
  f.addEventListener('submit', function(e){
    e.preventDefault(); var b = f.querySelector('button'), v = inp.value.trim();
    if(!/^\d{4}$/.test(v)){ inp.focus(); return; }
    b.disabled = true; b.textContent = 'Проверяем...';
    K.api('/api/kab/pair/' + encodeURIComponent(T) + '/login', {method:'POST', body:{pin:v}}).then(function(r){
      S = r.session; K.ls(SK, S); load();
    }, function(err){ pinScreen(err.status === 404 ? 'Ссылка не найдена - попросите новую у реализатора' : err.message); });
  });
}
function logout(){
  if(!confirm('Выйти из кабинета на этом устройстве? Для входа снова понадобится код.')) return;
  call('/logout', {method:'POST', body:{}}).catch(function(){}).then(function(){ K.ls(SK, null); K.ls('nsg-kab-t', null); S = ''; app.innerHTML = '<div class="center"><div class="card stack"><h2 style="margin:0">Вы вышли</h2><p class="mu" style="margin:0">Чтобы вернуться, откройте ссылку из сообщения реализатора.</p></div></div>'; });
}
function teamPct(){ var s = D.slots || []; if(!s.length) return 0; return Math.round(s.filter(function(x){ return x.status === 'ok' || x.status === 'no'; }).length / s.length * 100); }
function unpaid(){ return (D.payplan || []).filter(function(x){ return x.dir !== 'out' && !isPaid(x); }); }
function isPaid(x){ return /^(paid|получено|оплачено|да)$/i.test(String(x.status || '').trim()); }
function hero(){
  var dl = D.days_left, k = [];
  if(dl != null){
    if(dl > 0) k.push([K.fmt(dl), K.plural(dl, 'день', 'дня', 'дней') + ' до свадьбы']);
    else if(dl === 0) k.push(['Сегодня', 'ваш день']);
    else k.push(['∞', 'свадьба уже была']);
  }
  k.push([teamPct() + '%', 'команды собрано']);
  k.push([((D.anketa || {}).percent || 0) + '%', 'анкеты заполнено']);
  var sub = [D.date ? K.fmtDate(D.date) : '', D.guests ? D.guests + ' ' + K.plural(+D.guests || 0, 'гость', 'гостя', 'гостей') : '', D.venue || ''].filter(Boolean);
  return '<div class="hero" style="background:linear-gradient(180deg,rgba(40,0,2,.55) 0%,rgba(78,0,2,.78) 70%,rgba(78,0,2,.9)),url(\'' + HERO_PH + '\') center 40%/cover"><div class="sm" style="color:#f0d6cc">🔒 Личный кабинет · только для вас</div><h1 style="margin:4px 0 6px">' + esc(D.names) + '</h1>' +
    '<div class="mu">' + sub.map(esc).join(' · ') + '</div>' +
    '<div class="kpis">' + k.map(function(x){ return '<div class="kpi"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('') + '</div></div>';
}
function tabs(){
  return '<div class="tabs" role="tablist">' + TABS.filter(function(t){ return t[0] !== 'docs' || (D.docs || []).length; }).map(function(t){
    return '<button class="tab" role="tab" type="button" aria-selected="' + (TAB === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
}
function stagesHtml(){
  var cur = D.stage || 0;
  return '<div class="stages">' + (D.stages || []).map(function(s, i){ return '<span class="stg ' + (i < cur ? 'done' : i === cur ? 'cur' : '') + '">' + (i < cur ? '✓ ' : '') + esc(s) + '</span>'; }).join('') + '</div>';
}
function teamCard(){
  var t = D.team || {}, h = '<div class="card"><h3>Ваша команда НАВСЕГДА</h3>';
  if(t.realizer) h += '<div class="row" style="margin-bottom:10px"><div class="av" style="background:' + K.COL[0] + '">' + esc(K.ini(t.realizer)) + '</div><div><b>' + esc(t.realizer) + ' - реализатор</b><div class="sm mu">ведёт вашу свадьбу до самого дня</div></div></div>';
  if(t.manager) h += '<div class="row" style="margin-bottom:10px"><div class="av" style="background:' + K.COL[1] + '">' + esc(K.ini(t.manager)) + '</div><div><b>' + esc(t.manager) + '</b><div class="sm mu">менеджер</div></div></div>';
  h += '<a class="btn pr wide" href="' + esc(t.telegram || K.TG) + '" target="_blank" rel="noopener">Написать в Telegram</a>';
  h += '<p class="sm mu" style="margin:8px 0 0">Телефон: ' + esc(t.phone || K.PHONE) + '</p></div>';
  return h;
}
function main(){
  var todo = [];
  (D.slots || []).forEach(function(s){ if(s.status === 'choose' && !s.picked) todo.push(['👆', 'Выберите: ' + String(s.key).toLowerCase(), s.note || ((s.cands || []).length ? 'варианты уже ждут вас' : 'варианты скоро появятся'), 'team']); });
  var ap = (D.anketa || {}).percent || 0;
  if(ap < 100) todo.push(['📝', ap ? 'Дозаполните анкету' : 'Заполните анкету', 'заполнено ' + ap + '% - это нужно ведущему, фотографу и декору', 'anketa']);
  var u = unpaid()[0];
  if(u) todo.push(['💳', u.name || 'Платёж', [u.amount ? K.rub(u.amount) : '', u.due ? 'до ' + (K.parseDate(u.due) ? K.shortDate(u.due) : u.due) : ''].filter(Boolean).join(' · '), 'pay']);
  var h = '<div class="grid2"><div class="stack"><div class="card"><h3>Что нужно от вас</h3>' +
    (todo.map(function(t){ return '<div class="todo"><div class="ic" aria-hidden="true">' + t[0] + '</div><div style="flex:1;min-width:0"><b>' + esc(t[1]) + '</b><div class="sm mu">' + esc(t[2]) + '</div></div><button class="btn sm" type="button" data-tab="' + t[3] + '">Открыть</button></div>'; }).join('') || '<p class="mu" style="margin:0">Сейчас ничего не нужно - всё в работе 🤍</p>') + '</div>' +
    '<div class="card"><h3>Этап подготовки</h3>' + stagesHtml() + '</div></div><div class="stack">' + teamCard();
  var sm = D.smeta || {};
  if(sm.found && sm.total){
    var pct = Math.min(100, Math.round((sm.paid || 0) / sm.total * 100));
    h += '<div class="card money"><h3>Деньги</h3><div class="row sb sm"><span>Смета сейчас</span><b>' + K.rub(sm.total) + '</b></div><div class="row sb sm"><span>Внесено</span><b>' + K.rub(sm.paid) + '</b></div><div class="row sb sm"><span>Осталось</span><b>' + K.rub(sm.left) + '</b></div><div class="prog" style="margin-top:8px"><i style="width:' + pct + '%"></i></div></div>';
  }
  h += '</div></div><div class="card" style="margin-top:14px"><h3>Наши свадьбы 2026</h3><p class="sm mu" style="margin:0 0 10px">Живые кадры с проектов НАВСЕГДА - для вдохновения. Понравилось - напишите в «Анкете», учтём.</p><div class="gal">' +
    GALLERY.map(function(g){ return '<figure><img src="' + g[0] + '" alt="' + esc(g[1]) + '" loading="lazy"><figcaption>' + esc(g[1]) + '</figcaption></figure>'; }).join('') + '</div></div>';
  return h + '<p class="sm mu" style="text-align:center;margin:18px 0 0"><button class="btn sm gh" type="button" data-logout>Выйти на этом устройстве</button></p>';
}
function team(){
  var sl = D.slots || [];
  if(!sl.length) return '<div class="card mu">Команду реализатор добавит после брифа.</div>';
  return '<div class="card">' + sl.map(function(s, i){
    var st = K.stLabel(s.status), cls = st[0], lbl = s.status_text || st[1];
    if(s.picked && s.status === 'choose'){ cls = 'p-ok'; lbl = 'выбор отправлен'; }
    var info = [s.who, s.note].filter(Boolean).map(esc).join(' · ');
    var body = info ? '<div class="sm mu">' + info + '</div>' : '';
    if(s.status === 'choose'){
      if((s.cands || []).length){
        body += '<div class="cands">' + s.cands.map(function(c){
          var sel = s.picked === c.id;
          var cph = [].concat(c.photos || [])[0];
          return '<div class="cand' + (sel ? ' sel' : '') + '">' + (cph ? '<img class="cph" src="' + esc(cph) + '" alt="" loading="lazy">' : '<div class="cph-soon">📷 Скоро здесь появится фотография</div>') + '<b>' + esc(c.name) + '</b>' + (c.tag ? '<div class="sm mu">' + esc(c.tag) + '</div>' : '') + (c.price ? '<div class="sm">' + esc(c.price) + '</div>' : '') +
            (c.about ? '<div class="sm mu">' + esc(c.about) + '</div>' : '') + linksHtml(c) +
            '<button class="btn sm' + (sel ? ' pr' : '') + '" type="button" style="margin-top:6px" data-pick="' + esc(s.key) + '" data-item="' + esc(c.id) + '"' + (sel ? ' disabled' : '') + '>' + (sel ? '✓ Выбран' : 'Выбрать') + '</button></div>';
        }).join('') + '</div>';
      } else body += '<div class="sm mu">Варианты скоро появятся здесь.</div>';
    }
    return '<div class="slot"><div class="av" style="background:' + K.COL[i % K.COL.length] + '">' + esc(K.ini(s.key)) + '</div><div style="flex:1;min-width:0"><div class="row sb wrapf"><b>' + esc(s.key) + '</b><span class="pill ' + cls + '">' + esc(lbl) + '</span></div>' + body + '</div></div>';
  }).join('') + '</div><p class="sm mu" style="margin-top:10px">Когда вы выбираете вариант, реализатор сразу получает уведомление и бронирует подрядчика.</p>';
}
function linksHtml(c){
  var l = [].concat(c.links || []).filter(Boolean);
  return l.length ? '<div class="sm">' + l.map(function(u, i){ return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + (l.length > 1 ? 'Примеры ' + (i + 1) : 'Примеры работ') + '</a>'; }).join(' · ') + '</div>' : '';
}
function smetaLink(){
  var l = D.smeta_link;
  if(!l || !l.url) return '';
  return '<div class="card"><h3>Ваша смета</h3><p class="sm mu" style="margin:0 0 10px">Актуальная версия, которую мы вам отправляли' + (l.at ? ' ' + esc(l.at) : '') + '. Открывается в новой вкладке.</p><a class="btn pr" href="' + esc(l.url) + '" target="_blank" rel="noopener">Открыть смету</a></div>';
}
function smeta(){
  var sm = D.smeta || {}, top = smetaLink();
  if(!sm.found) return top || '<div class="card"><h3>Смета</h3><p class="mu" style="margin:0">Смета появится здесь, как только менеджер её пришлёт.</p></div>';
  var rows = sm.rows || [], h = '', cat = null;
  rows.forEach(function(r){ if(r.cat !== cat){ cat = r.cat; h += '<tr class="cat"><td colspan="2">' + esc(cat || 'Прочее') + '</td></tr>'; } h += '<tr><td>' + esc(r.name) + '</td><td>' + K.fmt(r.price) + '</td></tr>'; });
  return top + '<div class="card"' + (top ? ' style="margin-top:14px"' : '') + '><h3>Смета по позициям</h3><div class="scroll"><table><tr><th>Позиция</th><th>Стоимость, ₽</th></tr>' + h + '<tr class="tot"><td>Итого</td><td>' + K.rub(sm.total) + '</td></tr></table></div>' +
    '<div class="row sb" style="margin-top:12px"><span>Внесено</span><b>' + K.rub(sm.paid) + '</b></div><div class="row sb"><span>Осталось</span><b>' + K.rub(sm.left) + '</b></div>' +
    '<p class="sm mu" style="margin:10px 0 0">Смета обновляется автоматически, когда реализатор вносит изменения.</p></div>';
}
function pay(){
  var p = D.payplan || [], inn = p.filter(function(x){ return x.dir !== 'out'; }), out = p.filter(function(x){ return x.dir === 'out'; });
  if(!p.length) return '<div class="card"><h3>Оплаты</h3><p class="mu" style="margin:0">График платежей пришлёт реализатор.</p></div>';
  function when(x){ return isPaid(x) && x.paid_date ? x.paid_date : (K.parseDate(x.due) ? K.shortDate(x.due) : (x.due || '')); }
  var h = '';
  if(inn.length) h += '<div class="card"><h3>Ваши платежи</h3><div class="scroll"><table><tr><th>Платёж</th><th>Сумма, ₽</th><th>Когда</th><th>Статус</th></tr>' + inn.map(function(x){
    return '<tr><td>' + esc(x.name) + '</td><td>' + (x.amount ? K.fmt(x.amount) : '') + '</td><td>' + esc(when(x)) + '</td><td>' + (isPaid(x) ? '<span class="pill p-ok">получено</span>' : '<span class="pill p-warn">ожидаем</span>') + '</td></tr>';
  }).join('') + '</table></div><p class="sm mu" style="margin:10px 0 0">Как только организатор подтверждает платёж, статус меняется здесь сам. Каждый платёж подтверждаем чеком или распиской.</p></div>';
  if(out.length) h += '<div class="card" style="margin-top:14px"><h3>Оплаты подрядчикам</h3><p class="sm mu" style="margin:-4px 0 10px">Из ваших средств мы платим подрядчикам сами - здесь реестр.</p><div class="scroll"><table><tr><th>Кому</th><th>За что</th><th>Сумма, ₽</th><th>Статус</th></tr>' + out.map(function(x){
    return '<tr><td>' + esc(x.to || '') + '</td><td>' + esc(x.name) + '</td><td>' + (x.amount ? K.fmt(x.amount) : '') + '</td><td>' + (isPaid(x) ? '<span class="pill p-ok">оплачено' + (x.paid_date ? ' ' + esc(x.paid_date) : '') + '</span>' : '<span class="pill p-mu">запланировано</span>') + '</td></tr>';
  }).join('') + '</table></div></div>';
  return h;
}
function anketa(){
  var a = D.anketa || {}, ap = a.percent || 0;
  var h = '<div class="grid2"><div class="card"><h3>Анкета пары · ' + ap + '%</h3><div class="prog" style="margin-bottom:12px"><i style="width:' + Math.min(100, ap) + '%"></i></div>' +
    '<p class="sm mu">Анкета помогает ведущему, фотографу и декору понять вас: история, атмосфера, музыка, важные люди.</p>' +
    (a.link ? '<a class="btn pr" href="' + esc(a.link) + '" target="_blank" rel="noopener">' + (ap ? 'Дополнить анкету' : 'Заполнить анкету') + '</a>' : '<p class="mu sm" style="margin:0">Ссылку на анкету пришлёт реализатор.</p>') + '</div>';
  var w = D.wishes || [];
  h += '<div class="card"><h3>Пожелания и изменения</h3><p class="sm mu">Всё, что напишете здесь, сразу видит реализатор.</p><div class="feed">' +
    (w.length ? w.slice().reverse().map(function(x){ return '<div class="ev"><span aria-hidden="true">💬</span><span style="min-width:0"><span class="pre">' + esc(x.text) + '</span>' + (x.at ? '<br><time>' + esc(x.at) + '</time>' : '') + '</span></div>'; }).join('') : '<p class="mu sm" style="margin:0">Пока ничего не написали.</p>') + '</div>' +
    '<form id="wishForm" style="margin-top:12px"><div class="field"><label for="wish">Новое пожелание</label><textarea id="wish" rows="3" maxlength="1000" placeholder="Например: хотим холодные фонтаны на первый танец"></textarea></div><button class="btn pr" type="submit">Отправить</button></form></div></div>';
  return h;
}
function ideas(){
  var likes = D.likes || [], list = D.ideas || [];
  if(!list.length) return '<div class="card mu">Идеи скоро появятся.</div>';
  return '<p class="mu">Отметьте, что нравится, - реализатор учтёт это в программе и смете.</p><div class="grid3">' + list.map(function(x, i){
    var on = likes.indexOf(x.id) >= 0, ph = [].concat(x.photos || [])[0];
    return '<div class="idea">' + K.imgBox(ph, x.cat) + '<div class="b"><b>' + esc(x.name) + '</b>' + (x.tag ? '<p>' + esc(x.tag) + '</p>' : '') + (x.price ? '<p>' + esc(x.price) + '</p>' : '') +
      '<button class="btn' + (on ? ' pr' : '') + '" type="button" data-like="' + esc(x.id) + '" aria-pressed="' + on + '">' + (on ? '♥ Хотим' : '♡ Хотим') + '</button></div></div>';
  }).join('') + '</div>';
}
function docs(){
  var d = D.docs || [];
  if(!d.length) return '<div class="card mu">Документов пока нет.</div>';
  return '<div class="card"><h3>Документы</h3>' + d.map(function(x){ return '<div class="todo"><div class="ic" aria-hidden="true">📄</div><div style="flex:1;min-width:0">' + (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name || x.url) + '</a>' : esc(x.name)) + '</div></div>'; }).join('') + '</div>';
}
function render(){
  if(TAB === 'docs' && !(D.docs || []).length) TAB = 'main';
  if(!TABS.some(function(t){ return t[0] === TAB; })) TAB = 'main';
  document.title = (D.names || 'Кабинет') + ' · НАВСЕГДА';
  var body = ({main:main, team:team, smeta:smeta, pay:pay, anketa:anketa, ideas:ideas, docs:docs})[TAB]();
  var keep = $('#wish') ? $('#wish').value : '';
  app.innerHTML = hero() + tabs() + '<div id="tabBody">' + body + '</div>';
  if(keep && $('#wish')) $('#wish').value = keep;
  var f = $('#wishForm'); if(f) f.addEventListener('submit', sendWish);
}
function sendWish(e){
  e.preventDefault();
  var ta = $('#wish'), v = ta.value.trim(), b = e.target.querySelector('button');
  if(!v){ K.toast('Напишите пожелание'); ta.focus(); return; }
  b.disabled = true; b.textContent = 'Отправляем...';
  K.api('/api/kab/pair/' + encodeURIComponent(T) + '/wish', {method:'POST', body:{text:v}}).then(function(){
    ta.value = ''; K.toast('Отправлено реализатору'); return load(true);
  }, function(err){ K.toast(err.message); b.disabled = false; b.textContent = 'Отправить'; });
}
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t || !D) return;
  if(t.dataset.tab){ TAB = t.dataset.tab; history.replaceState(null, '', '#' + TAB); render(); if(t.classList.contains('sm')) window.scrollTo({top: $('.tabs').offsetTop - 70}); return; }
  if(t.dataset.pick){
    t.disabled = true; t.textContent = 'Отправляем...';
    K.api('/api/kab/pair/' + encodeURIComponent(T) + '/pick', {method:'POST', body:{slot:t.dataset.pick, item:t.dataset.item}}).then(function(){ K.toast('Выбор отправлен реализатору'); return load(true); }, function(err){ K.toast(err.message); t.disabled = false; t.textContent = 'Выбрать'; });
    return;
  }
  if(t.dataset.like){
    var id = t.dataset.like, on = (D.likes || []).indexOf(id) < 0;
    t.disabled = true;
    K.api('/api/kab/pair/' + encodeURIComponent(T) + '/like', {method:'POST', body:{item:id, on:on}}).then(function(){
      D.likes = on ? (D.likes || []).concat([id]) : (D.likes || []).filter(function(x){ return x !== id; });
      K.toast(on ? 'Отметили - реализатор увидит' : 'Отметка снята'); render();
    }, function(err){ K.toast(err.message); t.disabled = false; });
  }
});
window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if(D && h && h !== TAB){ TAB = h; render(); } });
if(!T){ app.innerHTML = K.notFound('В ссылке нет кода кабинета.'); return; }
load();
})();
</script>
</body>
</html>
