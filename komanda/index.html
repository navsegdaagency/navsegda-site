var S = K.q('s'), ITEMS = [], CAT = 'Все', SEL = null, list = $('#list');
function card(x, i, btn){
  var ph = [].concat(x.photos || [])[0], links = [].concat(x.links || []).filter(Boolean);
  return '<div class="idea">' + K.imgBox(ph, x.cat) +
    '<div class="b"><b>' + esc(x.name) + '</b>' + (x.tag ? '<p>' + esc(x.tag) + '</p>' : '') + (x.about ? '<p>' + esc(x.about) + '</p>' : '') + (x.price ? '<p>' + esc(x.price) + '</p>' : '') +
    (links.length ? '<p>' + links.map(function(u, j){ return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + (links.length > 1 ? 'Примеры ' + (j + 1) : 'Примеры работ') + '</a>'; }).join(' · ') + '</p>' : '') + (btn || '') + '</div></div>';
}
function cta(){ return '<div class="cta card"><div style="flex:1 1 240px"><b>Хотите так же на своей свадьбе?</b><div class="sm mu">Расскажите о дате и площадке - соберём команду и программу.</div></div><a class="btn pr" href="' + K.TG + '" target="_blank" rel="noopener">Написать в Telegram</a><span class="sm mu">' + K.PHONE + '</span></div>'; }
function renderCatalog(){
  var cats = ['Все'].concat(ITEMS.map(function(x){ return x.cat; }).filter(function(c, i, a){ return c && a.indexOf(c) === i; }));
  var shown = ITEMS.filter(function(x){ return CAT === 'Все' || x.cat === CAT; });
  list.innerHTML = '<div class="chips" style="margin:16px 0" role="group" aria-label="Категория">' + cats.map(function(c){ return '<button class="chip" type="button" aria-pressed="' + (CAT === c) + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    (shown.length ? '<div class="grid3">' + shown.map(function(x, i){ return card(x, i); }).join('') + '</div>' : '<p class="mu">Пока пусто.</p>') + cta();
}
function renderSel(){
  var picked = SEL.picked || [];
  $('#intro').innerHTML = '<div class="sm mu">Подборка для вас</div><h1 style="margin-top:4px">' + esc(SEL.names) + ': ' + esc(SEL.title || 'подборка') + '</h1><p class="mu" style="margin-top:8px">Отметьте всё, что нравится, - реализатор увидит сразу и вернётся с деталями.' + (SEL.slot ? ' Раздел: ' + esc(SEL.slot) + '.' : '') + '</p>';
  var items = SEL.items || [];
  list.innerHTML = (items.length ? '<div class="grid3" style="margin-top:16px">' + items.map(function(x, i){
    var on = picked.indexOf(x.id) >= 0;
    return card(x, i, '<button class="btn' + (on ? ' pr' : '') + '" type="button" data-like="' + esc(x.id) + '" aria-pressed="' + on + '">' + (on ? '♥ Нравится' : '♡ Нравится') + '</button>');
  }).join('') + '</div>' : '<p class="mu" style="margin-top:16px">В подборке пока ничего нет.</p>') +
    '<p class="sm mu" style="margin-top:16px">Вопросы - реализатору в <a href="' + K.TG + '" target="_blank" rel="noopener">Telegram</a> или по телефону ' + K.PHONE + '.</p>';
}
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.dataset.cat){ CAT = t.dataset.cat; renderCatalog(); return; }
  if(t.dataset.like && SEL){
    var id = t.dataset.like, on = (SEL.picked || []).indexOf(id) < 0; t.disabled = true;
    K.api('/api/kab/sel/' + encodeURIComponent(S) + '/pick', {method:'POST', body:{item:id, on:on}}).then(function(){
      SEL.picked = on ? (SEL.picked || []).concat([id]) : SEL.picked.filter(function(x){ return x !== id; });
      K.toast(on ? 'Отметили - реализатор увидит' : 'Отметка снята'); renderSel();
    }, function(err){ K.toast(err.message); t.disabled = false; });
  }
});
list.innerHTML = '<div class="grid3" style="margin-top:16px">' + K.skeleton() + K.skeleton() + K.skeleton() + '</div>';
if(S){
  $('#sub').textContent = 'подборка';
  try{ var m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex,nofollow'; document.head.appendChild(m); }catch(_){}
  $('#intro').innerHTML = '';
  K.api('/api/kab/sel/' + encodeURIComponent(S)).then(function(d){ SEL = d; document.title = (d.names || '') + ': ' + (d.title || 'подборка') + ' · НАВСЕГДА'; renderSel(); }, function(e){
    list.innerHTML = e.status === 404 ? K.notFound('Этой подборки нет.') : K.errBox(e, true);
  });
} else {
  K.api('/api/kab/catalog').then(function(d){ ITEMS = d.items || []; renderCatalog(); }, function(e){ list.innerHTML = '<div class="note" style="margin-top:16px">' + esc(e.message) + '</div>' + cta(); });
}
})();
</script>
</body>
</html>
